<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>מצנחי רחיפה נתניה | אטרקציות בנתניה - טיסות חוויה אוהד סחלב</title>
    <meta name="description" content="מחפשים אטרקציות בנתניה? בואו לטיסת חוויה במצנח רחיפה עם אוהד סחלב. אקרובטיקה, הנחה לקבוצות ונוף מדהים. הזמינו עכשיו!">
    <meta name="keywords" content="מצנחי רחיפה נתניה, אטרקציות בנתניה, טיסת חוויה, רחיפה, אוהד סחלב, ספורט אתגרי">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #e8b84b; --sky: #0b1e3d; --white: #f5f0e8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; 
            overflow: hidden; /* מונע גלילה */
            background: var(--sky); 
            font-family: 'Heebo', sans-serif;
            color: var(--white);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        header h1 { 
            font-size: 1.8rem; 
            color: var(--gold); 
            line-height: 1.2;
            margin-top: 5px;
        }

        .weather-row {
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            margin: 5px 0;
        }

        .video-box {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16/9;
            border: 2px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: rgba(245,240,232,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(232,184,75,0.3);
        }

        .card h3 { font-size: 1rem; color: var(--gold); }
        .card p { font-size: 0.85rem; }

        .btn-call {
            background: var(--gold);
            color: var(--sky);
            width: 100%;
            max-width: 500px;
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        footer { font-size: 0.7rem; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>מצנחי רחיפה נתניה</h1>
            <p style="font-size: 1rem;">טיסות חוויה ואקרובטיקה עם אוהד סחלב</p>
        </header>

        <div class="weather-row">
            <span>📍 נתניה - ארסוף</span>
            <span style="color:var(--gold)">● רוח: 8 קשרים (טיסה פעילה)</span>
        </div>

        <div class="video-box">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/S2C_mJp5ZkU?autoplay=1&mute=1&loop=1&playlist=S2C_mJp5ZkU" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="info-grid">
            <div class="card">
                <h3>טיסת יחיד</h3>
                <p>צילום וידאו כלול</p>
                <p><b>₪450</b></p>
            </div>
            <div class="card" style="border-color: var(--gold);">
                <h3>הנחה לקבוצות</h3>
                <p>4 איש ומעלה</p>
                <p><b>מחיר מיוחד!</b></p>
            </div>
        </div>

        <div style="width: 100%; max-width: 500px;">
            <a href="tel:0506968511" class="btn-call">הזמינו טיסה: 050-696-8511</a>
            <p style="font-size: 0.8rem;">מטיס מוסמך משנת 1998 | בטיחות מעל הכל</p>
        </div>

        <footer>
            © אוהד סחלב - אטרקציות בנתניה - 2026
        </footer>
    </div>

</body>
</html>
